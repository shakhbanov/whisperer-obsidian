# Релиз плагина: тег → сборка → три файла в GitHub Release.
#
# Каталог плагинов Obsidian забирает `main.js`, `manifest.json` и `styles.css`
# ИЗ ФАЙЛОВ РЕЛИЗА, а не из дерева репозитория, и имя тега обязано совпадать с
# `version` в манифесте. Поэтому сборка автоматическая: собранный руками файл
# однажды уехал бы в релиз из чужой ветки.
#
# Сторонних экшенов здесь НЕТ намеренно. Их использование можно запретить
# политикой аккаунта («разрешены только проверенные»), и тогда задание падает
# ДО первого шага — без единой строчки в логе, что и случилось с первым
# релизом. `gh` предустановлен на раннере и работает по встроенному
# `GITHUB_TOKEN`, так что публикация ни от кого не зависит.
name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Проверить, что тег совпадает с версией манифеста
        run: |
          manifest="$(node -p "require('./manifest.json').version")"
          if [ "$manifest" != "${GITHUB_REF_NAME}" ]; then
            echo "Тег ${GITHUB_REF_NAME} не совпадает с manifest.json ($manifest)" >&2
            exit 1
          fi

      - name: Собрать релиз и приложить файлы
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Релиз мог быть создан руками из интерфейса — тогда создавать его
          # заново не нужно, только долить файлы. `--clobber` перезаписывает
          # вложения, чтобы повторный запуск был безвредным.
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 \
            || gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes ""
          gh release upload "${GITHUB_REF_NAME}" \
            main.js manifest.json styles.css --clobber
